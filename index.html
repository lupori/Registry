<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greyhound Academy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --ink:#182848;
    --ink-deep:#0a1128;
    --parchment:#e6e9f0;
    --parchment-dim:#a9b4c9;
    --gold:#c9a961;
    --gold-bright:#e6c988;
    --oxide:#93a7c2;
    --line:rgba(201,169,97,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(184,150,79,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(122,59,52,0.08), transparent 55%),
      var(--ink-deep);
    color:var(--parchment);
    font-family:'Crimson Pro', serif;
    min-height:100vh;
  }

  .layout{
    display:flex;
    min-height:100vh;
  }

  /* MENU / ROSTER GRID VIEW */
  .menu-view{
    flex:1;
    padding:72px 64px;
    max-width:1100px;
    margin:0 auto;
  }

  .menu-header{
    text-align:center;
    margin-bottom:56px;
  }

  .menu-header .eyebrow{
    font-family:'Cinzel', serif;
    font-size:1.15rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--oxide);
    margin-bottom:12px;
  }

  .menu-header h1{
    font-family:'Cinzel', serif;
    font-size:2.4rem;
    font-weight:600;
    color:var(--gold-bright);
    margin:0;
  }

  .menu-header .sub{
    font-style:normal;
    font-size:0.7rem;
    letter-spacing:0.32em;
    color:var(--parchment-dim);
    margin-top:14px;
    text-transform:uppercase;
    font-family:'Cinzel', serif;
  }

  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:32px 24px;
  }

  .roster-tile{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .tile-frame{
    width:120px;
    height:120px;
    border:1px solid var(--gold);
    padding:4px;
    background:var(--ink);
    transition:border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  .roster-tile:hover .tile-frame{
    border-color:var(--gold-bright);
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }

  .tile-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:sepia(10%);
  }

  .tile-name{
    margin-top:12px;
    font-family:'Cinzel', serif;
    font-size:0.92rem;
    color:var(--parchment-dim);
    letter-spacing:0.02em;
    transition:color 0.25s ease;
  }

  .roster-tile:hover .tile-name{
    color:var(--gold-bright);
  }

  /* MAIN SHEET PAGE */
  .page{
    flex:1;
    padding:64px 72px;
    max-width:900px;
    margin:0 auto;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Cinzel', serif;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    cursor:pointer;
    margin-bottom:32px;
    background:none;
    border:none;
    padding:0;
  }

  .back-link:hover{
    color:var(--gold-bright);
  }

  .sheet-header{
    display:flex;
    gap:36px;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
    margin-bottom:36px;
  }

  .portrait-frame{
    width:150px;
    height:190px;
    flex-shrink:0;
    border:1px solid var(--gold);
    padding:5px;
    background:var(--ink);
  }

  .portrait-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:sepia(10%);
  }

  .header-text .eyebrow{
    font-family:'Cinzel', serif;
    font-size:0.68rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--oxide);
    margin-bottom:10px;
  }

  .header-text h1{
    font-family:'Cinzel', serif;
    font-size:2.6rem;
    font-weight:600;
    color:var(--gold-bright);
    margin:0 0 8px;
    line-height:1.1;
  }

  .header-text .subtitle{
    font-style:italic;
    color:var(--parchment-dim);
    font-size:1.05rem;
  }

  .sheet-body{
    font-size:1.08rem;
    line-height:1.75;
  }

  .sheet-section{
    margin-bottom:32px;
  }

  .sheet-section h2{
    font-family:'Cinzel', serif;
    font-size:0.85rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:14px;
  }

  .stat{
    border:1px solid var(--line);
    padding:12px 14px;
    background:rgba(184,150,79,0.04);
  }

  .stat-label{
    font-size:0.66rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--parchment-dim);
    margin-bottom:4px;
  }

  .stat-value{
    font-family:'Cinzel', serif;
    font-size:1.2rem;
    color:var(--gold-bright);
  }

  .sheet-body p{
    margin:0 0 14px;
    color:var(--parchment);
  }

  .sheet-body ul{
    margin:0;
    padding-left:20px;
  }

  .sheet-body li{
    margin-bottom:6px;
  }

  /* mobile */
  @media (max-width: 820px){
    .menu-view{
      padding:48px 24px;
    }
    .menu-header h1{
      font-size:1.9rem;
    }
    .roster-grid{
      grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
      gap:24px 16px;
    }
    .tile-frame{
      width:90px;
      height:90px;
    }
    .page{
      padding:36px 24px;
    }
    .sheet-header{
      flex-direction:column;
      align-items:flex-start;
    }
    .header-text h1{
      font-size:2rem;
    }
  }
</style>
</head>
<body>

<div class="layout" id="layout"></div>

<script>
/* ============================================================
   ADD YOUR CHARACTERS HERE.
   Copy an object below, change the fields, add it to the array.
   You can have up to 15+ characters — there's no limit.
   ============================================================ */
const characters = [
  {
    name: "Aiden Thorn",
    title: "Student - Metal manipulation",
    portrait: "https://i.pinimg.com/736x/73/7b/a4/737ba4496f2d69a9ecb085fdd0f62097.jpg",
    stats: {
      "Age": "17",
      "Origin": "Greyhills, Ohio",
      "Category": "A - Elemental Manifestations",
      "Faction": "Ferrum discipline"
    },
    sections: [
      {
        heading: "Appearance",
        html: `<p>Aiden has an athletic build and broad shoulders, which can make him seem intimidating despite not being particularly tall. With his shameless attitude and sharp tongue, his face usually carries a permanent smug grin. He has straw-brown hair, a strong, defined jawline, and a sharp, mischievous gaze. Overall, there's something rough and unpolished about his appearance.</p>`
      },
      {
        heading: "Personality",
        html: `<p>Although he has "settled down a lot with age" (according to his father), he still maintains a generally rebellious and defiant attitude toward authority figures. Aiden holds firm, somewhat old-fashioned values, and believes respect has to be earned, so he has little patience for being told what to do or where to stand simply because someone has authority over him.</p>
        <p>Despite being a bit of a troublemaker, people tend to like him. His particular kind of charisma, combined with the way he approaches life, creates that constant sense of "what's he going to do next?" that means he's rarely alone. However, his toxic dependence on that attention (born from a deep aversion to social rejection) often backfires on him more than he would like. He has gone as far as making reckless decisions or doing stupid things purely to draw attention to himself, though he would obviously never admit it.</p>
        <p>Aiden likes to claim that he "does his own thing," but in reality, he almost always ends up dragged into other people's conflicts due to his extremely temperamental nature and his tendency to defend lost causes. This has brought him plenty of problems, along with his habit of becoming overly familiar with people far too quickly.</p>
        <p>Ironically, because of how strongly he clings to values he considers essential (honor, loyalty, staying true to his principles) he can come across as more rigid than he actually is. In truth, Aiden is very open-minded and generally friendly toward almost anyone at first. That said, it doesn't take much for him to turn on someone if they start acting like an asshole.</p>`
      },
      {
        heading: "Background",
        html: `<p>The fifth of seven siblings, Aiden was raised in a conservative family that was torn apart by the Church of Scientology, like many others. The sect first took his father when Aiden was too young to properly remember him, and his mother followed shortly after. In his early years, Aiden didn't question much. However, his older sister's emancipation became the trigger for a growing sense of doubt. Seeing, through social media, the life she was building in New York (a life he had never even known was possible at the age of ten) awakened in him a deep longing for a world he had never been allowed to experience.</p>
        <p>Little by little, he began to question everything around him, becoming a serious problem for his parents. With half of his siblings already deeply indoctrinated, it became his personal mission to pull the others away from the same path. His parents, however, could not risk their standing within the church. It had already been difficult enough dealing with his older sister. Following the "out of sight, out of mind" logic, Aiden's increasingly rebellious behavior led to him being sent to a military boarding school at the age of thirteen.</p>
        <p>He was well-liked by the other boys and enjoyed sports, but the rigid structure of the institution felt deeply oppressive to someone with his personality. More often than not, it reminded him of the very life he had been trying to escape in the first place. Aiden proved to be a difficult student to manage.</p>
        <p>He refused to accept disrespect from authority figures simply because of their rank or position, which led to constant disciplinary action. Over time, detention became his default state.</p>
        <p>After a few years, one particular sergeant grew increasingly frustrated with him and developed a fixation. While Aiden was undeniably troublesome, this sergeant would punish him for things as minor as a slightly misaligned shoe or a "sloppy attitude" that could not be objectively proven, or would judge assigned chores as poorly done even when they were completed correctly. Gradually and deliberately, he made Aiden's life increasingly unbearable.</p>
        <p>Eventually, the situation escalated to a breaking point, what everyone later referred to simply as "the incident." Nobody ever fully understood what happened that day, but Aiden was placed in isolation immediately afterward.</p>
        <p>The next day, an elegant woman arrived at the institution, accompanied by several men in suits. There were stacks of documents, hushed conversations, and an unusual level of secrecy.</p>
        <p>Aiden left the facility the following day, fully convinced he was being transferred to a juvenile correctional prison. Instead, he was driven to Greyhound.</p>`
      },
      {
        heading: "Ability Description",
        html: `<p>Aiden's body generates magnetic fields that interfere with metallic matter in his surroundings. At its current stage, the ability manifests inconsistently, usually reacting to stress, anger, or fear rather than conscious intent. Small metal objects may vibrate, shift slightly, or be drawn toward him without warning, especially during moments of emotional instability.</p>
        <p>With training, the ability has the potential to evolve into full metal manipulation, allowing him to attract, repel, compress, reshape, and alter the structure of nearby metals through direct magnetic influence.</p>
        <p>Advanced applications may include: extracting metal from surrounding structures, shaping it into weapons or restraints, accelerating metallic fragments as projectiles, or reinforcing existing materials. At higher levels of precision, the ability could theoretically extend to the manipulation of iron within the human bloodstream, though such usage would require extreme control and physical strain.</p>
        <p>Because the ability relies on existing metallic sources, Aiden is significantly more dangerous in urban or industrial environments than in isolated natural settings.</p>
        <p><strong>Control Level:</strong> Unstable</p>`
      },
      {
        html: `<ul><li><strong>Likes:</strong> Any sport that involves some kind of competition, crowded and stimulating social settings, fast food, RuPaul (although he would never admit it), sarcastic humor, beer.</li><li><strong>Dislikes:</strong> coffee, being told what to do, fake people, strong perfume, math, waking up early.</li></ul>`
      }
    ]
  },
  {
    name: "Isolde Marrow",
    title: "Hedge-witch of the Blackthorn Marsh",
    portrait: "https://placehold.co/300x380/1a1a1a/b8964f?text=Portrait",
    stats: {
      "Age": "27",
      "Origin": "Blackthorn Marsh",
      "Role": "Utility / Illusion",
      "Alignment": "Chaotic Neutral"
    },
    sections: [
      {
        heading: "Appearance",
        html: "<p>Short, sharp-featured, always barefoot regardless of weather. Dresses in layered scavenged fabrics dyed with marsh-berry ink.</p>"
      },
      {
        heading: "Personality",
        html: "<p>Blunt, unbothered by social convention, finds most people's fears entertaining rather than sympathetic. Loyal once earned, which is rare.</p>"
      },
      {
        heading: "Background",
        html: "<p>Raised by the marsh itself after being abandoned as an infant, in local legend if nowhere else. Practices old, half-remembered magic that nobody has been able to categorize.</p>"
      },
      {
        heading: "Abilities",
        html: "<ul><li>Minor illusion / misdirection magic</li><li>Fluent in reading omens (questionable accuracy)</li><li>Immune to marsh toxins</li></ul>"
      }
    ]
  }
];

/* ============================================================
   Rendering logic — you shouldn't need to touch anything below
   ============================================================ */

function renderMenu(){
  const tiles = characters.map((c, i) => `
    <div class="roster-tile" onclick="openCharacter(${i})">
      <div class="tile-frame">
        <img src="${c.portrait}" alt="${c.name}">
      </div>
      <div class="tile-name">${c.name}</div>
    </div>
  `).join('');

  document.getElementById('layout').innerHTML = `
    <div class="menu-view">
      <div class="menu-header">
        <div class="eyebrow">Greyhound Academy</div>
        <h1>Student Registry</h1>
        <div class="sub">Official records of enrolled students — select a name to view their file</div>
      </div>
      <div class="roster-grid">${tiles}</div>
    </div>
  `;
  window.scrollTo(0,0);
}

function renderSheet(i){
  const c = characters[i];
  const statsHtml = Object.entries(c.stats).map(([label, value]) => `
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>
  `).join('');

  const sectionsHtml = c.sections.map(s => `
    <div class="sheet-section">
      ${s.heading ? `<h2>${s.heading}</h2>` : ''}
      ${s.html}
    </div>
  `).join('');

  document.getElementById('layout').innerHTML = `
    <div class="page">
      <button class="back-link" onclick="renderMenu()">← Back to Roster</button>
      <div class="sheet-header">
        <div class="portrait-frame">
          <img src="${c.portrait}" alt="${c.name}">
        </div>
        <div class="header-text">
          <div class="eyebrow">Character Sheet</div>
          <h1>${c.name}</h1>
          <div class="subtitle">${c.title}</div>
        </div>
      </div>
      <div class="sheet-body">
        <div class="sheet-section">
          <h2>Stats</h2>
          <div class="stat-grid">${statsHtml}</div>
        </div>
        ${sectionsHtml}
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function openCharacter(i){
  renderSheet(i);
}

renderMenu();
</script>

</body>
</html>
